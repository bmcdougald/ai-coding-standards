name: Tooling dependency audit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 1 * *'
permissions:
  contents: read
jobs:
  tooling-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [python, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.22.1'
      - run: python3 .quality/install.py --restore-tools
      - name: Audit tooling (including accepted findings)
        run: npm run tooling:audit:${{ matrix.ecosystem }}
